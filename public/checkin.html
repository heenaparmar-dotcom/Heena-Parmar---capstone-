<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Design World — Quick check-in</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header id="app-header"></header>
<main>
  <h1>What are you interested in today?</h1>
  <p class="muted">Confirm or update this before we pull your recommendations — it only takes a second.</p>
  <form id="checkin-form">
    <div class="field-row">
      <label>City</label>
      <input name="city" placeholder="Pune" required />
    </div>
    <div class="field-row">
      <label>Interests (comma-separated)</label>
      <input name="interests" placeholder="UX design, graphic design, typography" required />
    </div>
    <button type="submit">Show my recommendations</button>
  </form>
  <p id="status" class="muted"></p>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  const me = await fetchMe();
  if (!me.loggedIn) { window.location.href = "/"; return; }
  renderHeader(me);

  const data = await api("/api/preferences");
  const p = data.preferences || { locations: [], interests: [] };
  const form = document.getElementById("checkin-form");
  form.city.value = (p.locations || [])[0] || "";
  form.interests.value = (p.interests || []).join(", ");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const interests = f.get("interests").split(",").map((s) => s.trim()).filter(Boolean);
    const city = f.get("city").trim();
    try {
      await api("/api/preferences", {
        method: "POST",
        body: JSON.stringify({
          locations: [city],
          interests,
          eventTypes: p.eventTypes && p.eventTypes.length ? p.eventTypes : ["workshops", "events", "competitions"],
        }),
      });
      window.location.href = "/";
    } catch (err) {
      document.getElementById("status").textContent = err.message;
    }
  });
})();
</script>
</body>
</html>
